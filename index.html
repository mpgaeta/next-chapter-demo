</style></head><body><header><div style="max-width:760px;margin:auto"><h1>📚 Next Chapter</h1><p>Interactive demo · No sign-in required</p></div></header><main class="wrap"><div class="notice">This is a demo with sample books. Your changes stay in this browser on this device. They are not shared with other testers or the app creator.</div><nav id="tabs" aria-label="Book sections"><button data-tab="read">Read</button><button data-tab="want">To Read</button><button data-tab="authors">Authors</button><button data-tab="recommend">Recommendations</button></nav><div class="panel"><div class="heading"><div id="counts"></div><button class="primary" id="add">+ Add book</button></div></div><section id="content" class="panel"></section><p class="muted" style="text-align:center">Next Chapter Demo · Sample data only · No account or email needed</p></main>

'use strict';
const KEY='next-chapter-demo-v1';
const samples=[{id:1,title:'The Lincoln Lawyer',author:'Michael Connelly',status:'read',genre:'Mystery / Thriller',rating:5,notes:'Sample rating'},{id:2,title:'A Time to Kill',author:'John Grisham',status:'read',genre:'Mystery / Thriller',rating:4,notes:''},{id:3,title:'Killing Floor',author:'Lee Child',status:'read',genre:'Mystery / Thriller',rating:5,notes:''},{id:4,title:'The Nightingale',author:'Kristin Hannah',status:'want',genre:'Historical Fiction',rating:0,notes:''},{id:5,title:'The Boys in the Boat',author:'Daniel James Brown',status:'want',genre:'Nonfiction / History',rating:0,notes:''},{id:6,title:'Open Season',author:'C. J. Box',status:'want',genre:'Mystery / Thriller',rating:0,notes:''}];
const starterAuthors=['C. J. Box','John Grisham','Lee Child','Michael Connelly','Kristin Hannah'];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.books)||!Array.isArray(state.authors))state={books:samples,authors:starterAuthors};
let tab='read';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('This browser could not save changes.')}};
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});$('#counts').innerHTML=`<span class="stat">${state.books.filter(b=>b.status==='read').length} Read</span><span class="stat">${state.books.filter(b=>b.status==='want').length} To Read</span>`;const el=$('#content');if(tab==='read'||tab==='want'){const items=state.books.filter(b=>b.status===tab);el.innerHTML=`<h2>${tab==='read'?'Books Read':'Want to Read'}</h2><label for="filter">Search books</label><input id="filter" placeholder="Title or author"><div id="results"></div>`;const draw=()=>{const q=$('#filter').value.toLowerCase();const filtered=items.filter(b=>(b.title+' '+b.author).toLowerCase().includes(q));$('#results').innerHTML=filtered.length?filtered.map(b=>`<article class="book"><h3>${esc(b.title)}</h3><div class="meta">${esc(b.author)} · ${esc(b.genre)}</div>${b.rating?`<div class="stars" aria-label="${b.rating} out of 5 stars">${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)}</div>`:''}${b.notes?`<p>${esc(b.notes)}</p>`:''}<div class="actions"><button class="secondary" data-edit="${b.id}">Edit / Rate</button><button class="secondary" data-move="${b.id}">${tab==='read'?'Move to To Read':'Mark as Read'}</button><button class="danger" data-delete="${b.id}">Delete</button></div></article>`).join(''):'<p class="muted">No matching books yet. Try adding one!</p>'};$('#filter').addEventListener('input',draw);draw();}else if(tab==='authors'){el.innerHTML=`<h2>Favorite Authors</h2><p class="muted">These are sample authors. Add your own favorites.</p><label for="newAuthor">Author name</label><input id="newAuthor" placeholder="Enter an author"><button class="primary" id="addAuthor">+ Add author</button><div id="authorList"></div>`;$('#authorList').innerHTML=state.authors.map((a,i)=>`<article class="book"><div class="heading"><strong>${esc(a)}</strong><button class="danger" data-remove-author="${i}">Remove</button></div></article>`).join('');$('#addAuthor').onclick=()=>{const a=$('#newAuthor').value.trim();if(a&&!state.authors.some(x=>x.toLowerCase()===a.toLowerCase())){state.authors.push(a);save();render()}else alert('Enter a new author name.')}}else{const authors=[...new Set([...state.authors,...state.books.filter(b=>b.rating>=4).map(b=>b.author)])];el.innerHTML=`<h2>Recommendations</h2><p>Explore books by favorite authors and authors you rated highly.</p><p class="muted">These links search Open Library. Its catalog may not include every book.</p>${authors.map(a=>`<article class="book"><div class="heading"><strong>${esc(a)}</strong><a target="_blank" rel="noopener noreferrer" href="https://openlibrary.org/search?author=${encodeURIComponent(a)}">Search books</a></div></article>`).join('')}`;}}
function openEditor(id){const b=state.books.find(x=>x.id===id);const f=$('#bookForm');f.reset();for(const key of ['id','title','author','status','genre','rating','notes'])f.elements[key].value=b?b[key]:(key==='id'?'':key==='status'?'want':key==='rating'?'0':key==='genre'?'Mystery / Thriller':'');$('#formTitle').textContent=b?'Edit book':'Add book';$('#editor').showModal()}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};$('#add').onclick=()=>openEditor();$('#cancel').onclick=()=>$('#editor').close();$('#bookForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;const id=Number(f.elements.id.value)||Date.now();const b={id,title:f.elements.title.value.trim(),author:f.elements.author.value.trim(),status:f.elements.status.value,genre:f.elements.genre.value,rating:Number(f.elements.rating.value),notes:f.elements.notes.value.trim()};if(!b.title||!b.author)return;const i=state.books.findIndex(x=>x.id===id);if(i>=0)state.books[i]=b;else state.books.push(b);save();$('#editor').close();tab=b.status;render()};$('#content').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=Number(b.dataset.edit||b.dataset.move||b.dataset.delete);if(b.hasAttribute('data-edit'))openEditor(id);else if(b.hasAttribute('data-move')){const item=state.books.find(x=>x.id===id);if(item){item.status=item.status==='read'?'want':'read';save();render()}}else if(b.hasAttribute('data-delete')){if(confirm('Delete this demo book?')){state.books=state.books.filter(x=>x.id!==id);save();render()}}else if(b.hasAttribute('data-remove-author')){state.authors.splice(Number(b.dataset.removeAuthor),1);save();render()}};render();
