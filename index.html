<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16385c"><title>Next Chapter</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#19304a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#16385c;color:white;padding:22px 18px 18px}header h1{font-size:27px;margin:0}header p{margin:4px 0 0;color:#d5e3f3;font-size:13px}.shell{max-width:860px;margin:auto;padding-bottom:85px}.stats{display:flex;gap:10px;margin:16px}.stat{flex:1;background:white;border-radius:14px;padding:16px;text-align:center;box-shadow:0 1px 6px #152c4b12}.stat strong{font-size:26px;display:block}.stat span{font-size:12px;color:#62758b}main{padding:0 16px}.toolbar{display:flex;gap:8px;margin:12px 0}input,select,textarea{font:inherit;border:1px solid #d5dfe9;border-radius:10px;padding:12px;width:100%;background:white}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:#1d527f;color:white}button.secondary{background:#e9f0f7;color:#214769}button.danger{background:#fff0f0;color:#a73535}.book{background:white;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 1px 6px #152c4b10}.book h3{font-size:16px;margin:0 0 5px}.book p{color:#62758b;font-size:13px;margin:0 0 10px}.book .actions{display:flex;gap:7px;flex-wrap:wrap}.book .actions button{font-size:12px}.stars{color:#c38b19;letter-spacing:2px}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e0e7ee;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:4}.nav button{flex:1;max-width:180px;border-radius:0;background:white;color:#5d6f83;font-size:12px;padding:13px 2px}.nav button.active{color:#164c7d;background:#eaf2fa;font-weight:700}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px}.heading h2{font-size:21px}.empty{color:#60758a;padding:25px;text-align:center}.overlay{position:fixed;inset:0;background:#102b49aa;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.overlay.show{display:flex}.modal{background:white;border-radius:18px;padding:20px;width:100%;max-width:500px;max-height:90vh;overflow:auto}.modal h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;margin-bottom:5px;color:#4b6076}.modalfooter{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.muted{color:#61758b;font-size:13px}.notice{background:#e9f1fa;padding:15px;border-radius:12px;color:#355571;font-size:14px}.author{display:flex;align-items:center;justify-content:space-between;background:white;border-radius:12px;margin:8px 0;padding:14px}.author button{font-size:12px}.small{font-size:12px;color:#6d7d8e}a{color:#155d9d}
</style></head><body><div class="shell"><header><h1>📖 Next Chapter</h1><p>Sample-book demo · Your real library is not connected</p></header><div class="stats"><div class="stat"><strong id="readCount">41</strong><span>Books read</span></div><div class="stat"><strong id="wantCount">36</strong><span>Want to read</span></div><div class="stat"><strong id="authorCount">10</strong><span>Favorite authors</span></div></div><main id="content"></main></div><nav class="nav" id="nav"><button data-tab="read">✓ Read</button><button data-tab="want">▤ To Read</button><button data-tab="authors">♧ Authors</button><button data-tab="discover">✦ Recommendations</button></nav><div class="overlay" id="overlay"><div class="modal" id="modal"></div></div><script>
const initialBooks=[{"id": "sample-1", "title": "The Last Lighthouse", "author": "Alex Morgan", "status": "read", "rating": 5, "genre": "Mystery / Thriller", "notes": ""}, {"id": "sample-2", "title": "The Garden Path", "author": "Emma Reed", "status": "read", "rating": 4, "genre": "Fiction", "notes": ""}, {"id": "sample-3", "title": "Beyond the Mountains", "author": "Taylor Brooks", "status": "read", "rating": 5, "genre": "Adventure", "notes": ""}, {"id": "sample-4", "title": "The Winning Season", "author": "Jordan Lee", "status": "read", "rating": 4, "genre": "Sports", "notes": ""}, {"id": "sample-5", "title": "A Life in Letters", "author": "Morgan Hayes", "status": "want", "rating": 0, "genre": "Biography", "notes": ""}, {"id": "sample-6", "title": "The Science of Sleep", "author": "Sam Parker", "status": "want", "rating": 0, "genre": "Nonfiction", "notes": ""}, {"id": "sample-7", "title": "Summer in Paris", "author": "Jamie Ellis", "status": "want", "rating": 0, "genre": "Romance", "notes": ""}, {"id": "sample-8", "title": "The Curious Map", "author": "Casey Stone", "status": "want", "rating": 0, "genre": "Other", "notes": ""}];const initialAuthors=["CJ Box", "David Baldacci", "James Patterson", "John Grisham", "Lee Child", "Steven Fry", "Walter Isaacson", "Harlan Coplan ??", "Marcia Clark", "Michael Connelly"];const key='next-chapter-sample-demo-v2';let saved;try{saved=JSON.parse(localStorage.getItem(key))}catch(e){}let books=Array.isArray(saved?.books)?saved.books:initialBooks;let authors=Array.isArray(saved?.authors)?saved.authors:initialAuthors;let tab='read',query='';const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const genres=['','Mystery / Thriller','Fiction','Nonfiction','Biography','Adventure','Sports','Romance','Other'];function persist(){localStorage.setItem(key,JSON.stringify({books,authors}))}function setTab(t){tab=t;query='';render()}function render(){el('readCount').textContent=books.filter(b=>b.status==='read').length;el('wantCount').textContent=books.filter(b=>b.status==='want').length;el('authorCount').textContent=authors.length;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let content=el('content');if(tab==='read'||tab==='want'){let matches=books.filter(b=>b.status===tab&&[b.title,b.author,b.genre].some(v=>v.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>a.title.localeCompare(b.title));content.innerHTML=`<div class="heading"><h2>${tab==='read'?'Books Read':'To Read'}</h2><button onclick="editBook()">+ Add book</button></div><div class="toolbar"><input aria-label="Search books" placeholder="Search title, author or genre" value="${esc(query)}" oninput="query=this.value;renderList()"></div><div id="bookList"></div>`;renderList()}else if(tab==='authors'){content.innerHTML=`<div class="heading"><h2>Favorite Authors</h2><button onclick="addAuthor()">+ Add author</button></div>${authors.map(a=>`<div class="author"><div><b>${esc(a)}</b><div class="small">${books.filter(b=>b.author.toLowerCase()===a.toLowerCase()).length} books in library</div></div><button class="secondary" onclick='searchAuthor(${JSON.stringify(a)})'>Find books</button><button class="danger" onclick='deleteAuthor(${JSON.stringify(a)})'>Delete</button></div>`).join('')}`}else{let rated=books.filter(b=>b.status==='read'&&b.rating>=4),ranked=[...rated].sort((a,b)=>b.rating-a.rating);let favGenres={};rated.forEach(b=>{if(b.genre)favGenres[b.genre]=(favGenres[b.genre]||0)+1});content.innerHTML=`<div class="heading"><h2>Recommended Books</h2></div><div class="notice"><b>Recommendation starter</b><p>This sample demo uses favorite authors and highly rated books to guide recommendations. It does not yet automatically fetch new titles or send release alerts.</p></div><h3>Your highest-rated books</h3>${ranked.length?ranked.slice(0,6).map(b=>`<div class="book"><h3>${esc(b.title)}</h3><p>${esc(b.author)} · <span class="stars">${'★'.repeat(b.rating)}</span></p></div>`).join(''):'<p class="muted">Rate some books 4 or 5 stars to help guide future recommendations.</p>'}<h3>Explore favorite authors</h3>${authors.map(a=>`<div class="author"><b>${esc(a)}</b><button onclick='searchAuthor(${JSON.stringify(a)})'>Search Open Library ↗</button></div>`).join('')}<p class="muted">Open Library searches open in a new tab. New titles must be added manually for now.</p><div class="toolbar"><button class="secondary" onclick="downloadBackup()">Download my data backup</button></div>`}}
function renderList(){let list=el('bookList');if(!list)return;let matches=books.filter(b=>b.status===tab&&[b.title,b.author,b.genre].some(v=>v.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>a.title.localeCompare(b.title));list.innerHTML=matches.map(b=>`<article class="book"><h3>${esc(b.title)}</h3><p>${esc(b.author)}${b.genre?' · '+esc(b.genre):''}${b.rating?' · <span class="stars">'+'★'.repeat(b.rating)+'</span>':''}</p><div class="actions"><button class="secondary" onclick='editBook(${JSON.stringify(b.id)})'>Edit details</button><button onclick='moveBook(${JSON.stringify(b.id)})'>${b.status==='read'?'Move to To Read':'Mark as read'}</button></div></article>`).join('')||'<div class="empty">No books found.</div>'}
function closeModal(){el('overlay').classList.remove('show')}el('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});function editBook(id){let b=books.find(x=>x.id===id)||{id:'new-'+Date.now(),title:'',author:'',status:tab==='want'?'want':'read',rating:0,genre:'',notes:''};el('modal').innerHTML=`<h2>${id?'Edit book':'Add a book'}</h2><form id="bookForm"><div class="field"><label>Title<input name="title" required value="${esc(b.title)}"></label></div><div class="field"><label>Author<input name="author" required value="${esc(b.author)}"></label></div><div class="field"><label>Reading status<select name="status"><option value="read" ${b.status==='read'?'selected':''}>Read</option><option value="want" ${b.status==='want'?'selected':''}>To Read</option></select></label></div><div class="field"><label>Genre<select name="genre">${genres.map(g=>`<option value="${esc(g)}" ${b.genre===g?'selected':''}>${esc(g||'Select genre')}</option>`).join('')}</select></label></div><div class="field"><label>Star rating<select name="rating">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${b.rating===n?'selected':''}>${n===0?'Not rated':`${n} star${n===1?'':'s'}`}</option>`).join('')}</select></label></div><div class="field"><label>Personal notes<textarea name="notes" rows="3">${esc(b.notes)}</textarea></label></div><div class="modalfooter">${id?'<button type="button" class="danger" id="deleteBook">Remove</button>':'<button type="button" class="secondary" onclick="closeModal()">Cancel</button>'}<button type="submit">Save book</button></div></form>`;el('overlay').classList.add('show');el('bookForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let obj={...b,title:f.get('title').trim(),author:f.get('author').trim(),status:f.get('status'),genre:f.get('genre'),rating:Number(f.get('rating')),notes:f.get('notes')};books=id?books.map(x=>x.id===id?obj:x):[...books,obj];persist();closeModal();render()};if(id)el('deleteBook').onclick=()=>{if(confirm('Remove this book?')){books=books.filter(x=>x.id!==id);persist();closeModal();render()}}}
function moveBook(id){books=books.map(b=>b.id===id?{...b,status:b.status==='read'?'want':'read'}:b);persist();render()}function addAuthor(){let name=prompt('Favorite author name');if(name&&name.trim()&&!authors.some(a=>a.toLowerCase()===name.trim().toLowerCase())){authors.push(name.trim());persist();render()}}function deleteAuthor(name){if(!confirm('Remove '+name+' from favorite authors? Sample books will not be deleted.'))return;authors=authors.filter(a=>a!==name);persist();render()}function searchAuthor(a){window.open('https://openlibrary.org/search?q='+encodeURIComponent(a),'_blank','noopener,noreferrer')}function downloadBackup(){let blob=new Blob([JSON.stringify({books,authors},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='next-chapter-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));render();
</script></body></html>
